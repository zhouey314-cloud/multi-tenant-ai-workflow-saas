<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TenantFlow · Synthetic Demo</title><style>body{font:16px system-ui;margin:0;background:#eef3f7;color:#132339}header{background:#11263b;color:white;padding:2rem}main{max-width:1000px;margin:auto;padding:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}section{background:white;padding:1.3rem;border-radius:12px;box-shadow:0 5px 20px #16304b14}button,input,select{font:inherit;padding:.7rem;margin:.3rem}button{background:#126b69;color:white;border:0;border-radius:6px;cursor:pointer}small{color:#576478}li{margin:.6rem 0}</style><header><h1>TenantFlow</h1><p>Multi-tenant knowledge → content review → publish. Synthetic data only.</p></header><main><section><label>Demo account <select id="account"><option value="hq@example.com">HQ · hq@example.com</option><option value="store@example.com">Store · store@example.com</option><option value="review@example.com">Reviewer · review@example.com</option></select></label><button onclick="load()">Switch view</button><p id="identity"></p></section><div class="grid"><section><h2>Knowledge</h2><ul id="knowledge"></ul></section><section><h2>Content tasks</h2><ul id="tasks"></ul></section><section><h2>Audit</h2><ul id="audit"></ul></section></div><p><small>Demo passwords are public examples. No production authentication, database, model, or publishing integration.</small></p></main><script>const passwords={'hq@example.com':'demo-hq-only','store@example.com':'demo-store-only','review@example.com':'demo-review-only'};async function api(path,method='GET',body){let user=document.querySelector('#account').value;let r=await fetch('/api/'+path,{method,headers:{'x-demo-user':user,'x-demo-password':passwords[user],'content-type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json()}async function load(){let v=await api('overview');document.querySelector('#identity').textContent=v.actor?.role+' · '+v.actor?.unit;for(let key of ['knowledge','tasks','audit'])document.querySelector('#'+key).innerHTML=(v[key]||[]).map(x=>'<li>'+escapeHTML(x.title||x.action)+' '+escapeHTML(x.state||x.visibility||'')+(key==='tasks'?'<button data-id="'+escapeHTML(x.id)+'" data-state="'+escapeHTML(x.state)+'">Advance</button>':'')+'</li>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let next={draft:'review',review:'approved',approved:'published'}[b.dataset.state];if(next){let x=await api('tasks/'+b.dataset.id,'POST',{to:next});if(x.error)alert(x.error);load()}})}function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></html>
